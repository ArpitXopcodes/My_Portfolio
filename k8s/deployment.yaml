apiVersion: apps/v1
kind: Deployment
metadata:
  name: arpit-portfolio
  labels:
    app: arpit-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arpit-portfolio
  template:
    metadata:
      labels:
        app: arpit-portfolio
    spec:
      containers:
        - name: arpit-portfolio
          image: arpit-portfolio:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
